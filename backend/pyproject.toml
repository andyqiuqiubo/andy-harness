[project]
name = "harness"
version = "1.0.0"
description = "andy-harness — 插件化 Agent Harness 智能体底座"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "tiktoken>=0.7.0",
    "pillow>=10.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# Computer Use（桌面操控：截图/鼠标/键盘）所需的可选依赖。
# 缺失时 RealDesktopController.available 优雅降级为 False，核心对话能力不受影响；
# 需启用 Computer Use 时再安装（见 README「可选：桌面操控依赖」）。
desktop = [
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
]
# andy-repeat（桌面操作录制与确定性回放）所需的可选依赖。
# 缺失时 andy_repeat 插件加载但 available=false，工具返回明确降级提示（不抛栈）。
# pynput=全局输入钩子；uiautomation=UIA 语义取证/Pattern 动作（系统 API 薄封装）；
# mss/pyautogui 复用 desktop extra。图像锚点多尺度匹配可选装 repeat-image。
repeat = [
    "pynput>=1.7.6",
    "uiautomation>=2.0.18",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
]
repeat-image = [
    "opencv-python-headless>=4.9",
]
# 飞书 Channel 入站（群里 @机器人回群）所需的可选依赖。
# 缺失时 feishu_channel 优雅降级（channel 模式不可用，api/cli 模式不受影响）；
# 需启用飞书群聊入站时再安装（见 feishu_channel.py 顶部的 import 守护）。
feishu = [
    # 飞书官方服务端 SDK（channel 模式 WebSocket 长连需要）。
    # 代码按 1.7.x 的 API 实测：EventDispatcherHandler.builder("", "")
    #   → .register_p2_im_message_receive_v1(f) → .build()，以及 lark.ws.Client。
    # 低于 1.7 的版本事件注册方式可能不同，请勿放宽下限。
    "lark-oapi>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = "tests/"

# 无类型桩的第三方/可选桌面库：import 解析为 Any（对齐 computer_use 的可选依赖处理，
# 不放松自有代码的 strict 检查）。
[[tool.mypy.overrides]]
module = [
    "pynput.*",
    "uiautomation.*",
    "comtypes.*",
    "cv2.*",
    "mss.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


