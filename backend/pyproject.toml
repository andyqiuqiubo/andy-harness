[project]
name = "harness"
version = "1.0.0"
description = "andy-harness — 插件化 Agent Harness 智能体底座"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "tiktoken>=0.7.0",
    "pillow>=10.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# Computer Use（桌面操控：截图/鼠标/键盘）所需的可选依赖。
# 缺失时 RealDesktopController.available 优雅降级为 False，核心对话能力不受影响；
# 需启用 Computer Use 时再安装（见 README「可选：桌面操控依赖」）。
desktop = [
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = "tests/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


